[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2real-prompt-annotation"
version = "0.1.0"
description = "Project-specific compact prompts for paired Sim/Real LeRobot data"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["sim2real", "lerobot", "qwen", "vlm", "robotics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "openai>=1.40,<3",
  "opencv-python-headless>=4.8",
  "pydantic>=2.0,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.9",
  "twine>=5.0",
]

[project.scripts]
sim2real-prompt = "sim2real_prompt_annotation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sim2real_prompt_annotation = [
  "prompts/*.txt",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["build", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
