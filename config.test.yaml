# Formal pre-experiment configuration for model_train/test.
# DASHSCOPE_API_KEY and DASHSCOPE_BASE_URL are injected by the operator.
dataset:
  root: /media/datasets/EWM_SIM_REAL_PAIRS/model_train/test
  dataset_glob: "*"
  real_view: camera_head
  min_episode_frames: 81
  metadata_manifest: null
  split_manifest: null

prompt:
  frame_count: 8
  sampling: uniform
  resize_long_edge: 512
  jpeg_quality: 85
  system_prompt: ./src/sim2real_prompt_annotation/prompts/prompt_system.txt
  temperature: 0.1
  max_tokens: 256
  provider:
    name: qwen_openai
    model: qwen3.5-plus
    api_key_env: DASHSCOPE_API_KEY
    base_url: null
    base_url_env: DASHSCOPE_BASE_URL
    response_format: json_object
    enable_thinking: false
    timeout_seconds: 180

reference:
  backend: robotseg
  # Fill all null digests with the exact production checkpoint hashes before
  # the formal run. The repository never downloads or guesses a checkpoint.
  model_path: ./weights/robotseg.pt
  model_sha256: null
  robotseg_config: configs/robotseg-infer
  robot_category: robot
  device: cuda:0
  batch_size: 16
  robot_queries: [robot, robot arm, robot gripper]
  residual_check: true
  # Official Ultralytics v8.3.0 asset; SHA-256:
  # 8e439445c87338b79d9ce21dec109f4621e26df67e94d26ea1a98c1e64dce3e3
  yoloe_model_path: ./weights/yoloe-11s-seg.pt
  yoloe_model_sha256: 8e439445c87338b79d9ce21dec109f4621e26df67e94d26ea1a98c1e64dce3e3
  yoloe_text_model_path: ../weights/mobileclip_blt.ts
  yoloe_text_model_sha256: a67804d1b0f07b8b9a20c1761ec0847f34660f5fa338ec70e8f3fce68ed95e54
  yoloe_image_size: 640
  yoloe_confidence: 0.05
  yoloe_iou_threshold: 0.50
  embedding_cache_size: 16
  mask_close_kernel: 9
  mask_dilation_pixels: 12
  min_mask_area_fraction: 0.002
  max_mask_area_fraction: 0.75
  max_residual_area_fraction: 0.002
  min_inpaint_change_fraction: 0.01
  inpainting_backend: big_lama
  inpainting_model_path: ./weights/big-lama
  inpainting_model_sha256: null
  inpainting_device: cuda:0
  inpainting_modulo: 8
  jpeg_quality: 95

runtime:
  decode_workers: 4
  api_concurrency: 4
  api_retry_count: 4
  backoff_initial_seconds: 1.0
  backoff_max_seconds: 30.0
  resume: true
  fail_fast: false
  log_costs: true
  input_cost_per_million: null
  output_cost_per_million: null

output:
  root: /media/datasets/EWM_SIM_REAL_PAIRS/model_train/artifacts/test/prompt
  prompt_filename: episodes_prompt.jsonl
  reference_filename: reference_images.jsonl
  reference_directory: Reference
