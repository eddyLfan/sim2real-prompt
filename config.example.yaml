# Relative paths are resolved from this YAML file, not the current shell directory.
dataset_root: ./data
output_root: ./outputs
metadata_manifest: null

provider:
  name: qwen_openai
  model: qwen3.7-plus
  api_key_env: DASHSCOPE_API_KEY
  base_url: null
  base_url_env: DASHSCOPE_BASE_URL
  # JSON Object plus local Pydantic validation is the conservative default.
  # qwen3.7-plus also supports strict json_schema if desired after the smoke test.
  response_format: json_object
  enable_thinking: false
  timeout_seconds: 180

# Paired LeRobot discovery reads one dataset-directory level and metadata only.
# A Sim video key must end in `_sim`; its Real key is the same name without `_sim`.
discovery:
  # Defaults match the original 161-frame, stride-120 training recipe.
  min_episode_frames: 161
  required_views: [camera_head, camera_wrist_left, camera_wrist_right]
  require_later_window: true
  window_stride: 120

media:
  mode: selected_frames       # selected_frames | native_video
  strategy: uniform           # uniform | keyframe
  max_frames: 6
  resize_long_edge: 512
  jpeg_quality: 85
  views: []                   # empty means every paired view
  reference_view: camera_head
  native_video_fps: 2.0
  max_native_video_mb: 100

annotation:
  temperature: 0.1
  max_tokens: 3000
  retry_count: 2             # malformed JSON / schema retry count
  severe_retry_count: 1
  confidence_threshold: 0.55
  drop_low_confidence_fields: true
  # Omit system_prompt to use the template bundled with the Python package.

critic:
  enabled: true
  temperature: 0.0
  max_tokens: 2200
  retry_count: 2             # malformed critic JSON / schema retry count
  apply_safe_edits: true
  fail_on_severe_after_retries: true
  # Omit system_prompt to use the template bundled with the Python package.

renderer:
  max_prompt_length: 6000
  deduplicate_across_fields: true
  reference_appearance_text: Match the visual appearance of the robot, objects, tabletop, and background environment to the reference image.
  minimal_environment_text: Match the real-world environment shown in the reference image.
  variants:
    full:
      fields: [robot, camera, task, actions, scene, objects, environment, appearance, lighting, imaging, preserve]
      appearance_mode: detailed
      omit_visible_in_reference: false
      environment_reference_override: false
    reference:
      fields: [robot, task, objects, environment, appearance]
      appearance_mode: reference
      omit_visible_in_reference: true
      environment_reference_override: false
    semantic:
      fields: [robot, task, scene, objects, environment]
      appearance_mode: none
      omit_visible_in_reference: false
      environment_reference_override: false
    minimal:
      fields: [robot, task, environment]
      appearance_mode: none
      omit_visible_in_reference: false
      environment_reference_override: true

batch:
  concurrency: 4
  api_retry_count: 4
  backoff_initial_seconds: 1.0
  backoff_max_seconds: 30.0
  # After all per-request retries, rerun only failed samples this many times.
  failed_retry_rounds: 1
  failed_retry_backoff_seconds: 2.0
  skip_completed: true
  # Exit non-zero and write logs/incomplete_samples.jsonl if any selected episode is missing.
  require_complete: true
  log_costs: true
  input_cost_per_million: null
  output_cost_per_million: null

dataset_prompt_export:
  enabled: true
  variants: [full, reference, semantic, minimal]
  filename: episodes_prompt.jsonl
  # Partial episode runs replace selected rows and retain all other existing rows.
  merge_existing: true

augmentation:
  field_dropout_enabled: false
  prompt_paraphrase_enabled: false
  text_appearance_override_enabled: false
