# Relative paths are resolved from this YAML file.
dataset_root: ./data
output_root: ./outputs
metadata_manifest: null

provider:
  name: qwen_openai
  model: qwen3.7-plus
  api_key_env: DASHSCOPE_API_KEY
  base_url: null
  base_url_env: DASHSCOPE_BASE_URL
  response_format: json_object
  enable_thinking: false
  timeout_seconds: 180

discovery:
  min_episode_frames: 1
  required_views: []

media:
  mode: selected_frames       # selected_frames | native_video
  strategy: uniform           # uniform | keyframe
  max_frames: 6
  resize_long_edge: 512
  jpeg_quality: 85
  views: []                   # empty means every paired view
  reference_view: camera_head
  reference_seed: 42          # reproducibly random frame per episode
  native_video_fps: 2.0
  max_native_video_mb: 100

annotation:
  temperature: 0.1
  max_tokens: 3000
  retry_count: 2
  severe_retry_count: 1
  confidence_threshold: 0.55

critic:
  enabled: true
  temperature: 0.0
  max_tokens: 1800
  retry_count: 2
  fail_on_severe_after_retries: true

renderer:
  max_prompt_words: 55
  max_prompt_characters: 480
  include_setting_label: true

batch:
  concurrency: 4
  api_retry_count: 4
  backoff_initial_seconds: 1.0
  backoff_max_seconds: 30.0
  failed_retry_rounds: 1
  failed_retry_backoff_seconds: 2.0
  skip_completed: true
  require_complete: true
  log_costs: true
  input_cost_per_million: null
  output_cost_per_million: null

dataset_prompt_export:
  enabled: true
  filename: episodes_prompt.jsonl
  merge_existing: true
